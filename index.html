function V(){
const v=S.view;
if(v==='ob'){const s=SL[S.ob],last=S.ob===2;return `<section class="ob"><div class="top"><b class="logo">ReUse</b><button class="pill" data-a="skip">Lewati</button></div><div class="art">${ART.map(a=>`<div class="fl" style="${a[3]}"><i>${ic(a[2],16)}</i><span>${a[0]}<small>${a[1]}</small></span></div>`).join('')}<div class="big">${ic(s[2],54)}</div></div><div class="sheet" style="min-height:230px;display:flex;flex-direction:column"><h1>${s[0]}</h1><p>${s[1]}</p><div class="l sp" style="margin-top:auto;padding-top:26px"><div class="dots">${SL.map((_,i)=>`<b class="${i===S.ob?'on':''}"></b>`).join('')}</div><button class="btn sm" data-a="next">${last?'Mulai':'Lanjut'} ${ic('arrow',16)}</button></div></div></section>`}
if(v==='login'){const a=S.auth,er=S.err?`<div class="err">${S.err}</div>`:'';let b;
if(a.step==='email')b=`<h1>Daftar atau masuk</h1><p>Gunakan email kampus berakhiran .ac.id. Kami kirim kode OTP untuk verifikasi.</p><input class="fld" id="em" type="email" placeholder="mahasiswa@mail.unpad.ac.id" required autocomplete="email" value="${esc(a.email)}">${er}<button class="btn" type="submit">Kirim kode OTP</button>`;
else if(a.step==='otp')b=`<h1>Masukkan kode OTP</h1><p>Kode 6 digit untuk ${esc(a.email)}.</p><div class="demo"><b>Mode demo:</b> email belum terkirim sungguhan. Kode kamu <b>${a.code}</b>.</div><input class="fld otp" id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Kode OTP" required>${er}<button class="btn" type="submit">Verifikasi</button><button type="button" class="btn out" style="margin-top:8px" data-a="resend">Kirim ulang kode</button><button type="button" class="btn out" style="margin-top:8px;border:0" data-a="chgem">Ganti email</button>`;
else b=`<h1>Pilih kampusmu</h1><p style="margin-bottom:12px">Barang di sekitar kampus ini akan tampil di beranda.</p>${CAMP.map(c=>`<button type="button" class="opt" data-a="campus" data-v="${c}" aria-pressed="${a.campus===c}">${ic('pin',18)}${c}</button>`).join('')}${er}<button class="btn" type="submit" style="margin-top:6px">Selesai daftar</button>`;
return `<section class="lg0"><div class="circ" style="width:340px;height:340px;right:-90px;top:-40px"></div><div class="circ" style="width:190px;height:190px;left:-60px;top:30%"></div><div style="position:absolute;left:24px;top:16%;color:#fff"><div class="big" style="position:static;transform:none;width:58px;height:58px;border-radius:16px">${ic('refresh',30)}</div><div style="font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:12px">ReUse</div><div style="font-style:italic;color:#CFE3C8">Your Old, Their Gold</div></div><form class="sheet" id="lf" style="margin:0">${b}</form></section>`}
if(v==='home'){const L=S.items.filter(i=>!i.sold&&(S.m==='all'||i.m===S.m));return `<header class="hd"><div class="r"><span class="logo">ReUse</span><span class="loc">${ic('pin',12)}${esc(camp())}</span></div><p style="margin-top:10px;font-size:13px;opacity:.9">Barang lama, nilai baru di sekitar kampusmu.</p></header><main><div class="chips">${MS.map(x=>chip('hm',x[0],S.m===x[0],x[1])).join('')}</div><h2 class="s" style="margin-top:4px">Terbaru di sekitar kampusmu<small>${L.length} barang</small></h2><div class="grid">${L.map(card).join('')||'<p class="empty">Belum ada barang untuk metode ini. Ketuk + untuk posting.</p>'}</div></main>${nav('home')}`}
if(v==='detail'){const i=item(S.cur);if(!i)return '';const own=i.own,ph=i.photos&&i.photos.length?i.photos:null;return `<div class="dh" style="background:${col(i)};padding:0"><button class="ib" style="left:14px;z-index:2" data-a="go" data-v="${S.from}" aria-label="Kembali">${ic('back')}</button>${ph?`<div class="car">${ph.map((p,n)=>`<div><img src="${p}" alt="Foto ${n+1} ${esc(i.name)}"></div>`).join('')}</div>`:ic(CI[i.cat],84)}${ph&&ph.length>1?`<small style="position:absolute;right:14px;bottom:30px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:3px 10px">Geser, ${ph.length} foto</small>`:''}</div><div class="dc">${bd(i.m)}<h1>${esc(i.name)}</h1><div class="p">${priceT(i)}</div><div class="tb"><div><span>Kondisi</span><b>${i.cond}</b></div><div><span>Kategori</span><b>${i.cat}</b></div><div><span>Lokasi</span><b>${esc(camp())} · ${kmT(i.km)}</b></div><div><span>Titik COD</span><b>${esc(i.cod||'Gerbang Lama Unpad')}</b></div></div><p style="line-height:1.55;font-size:13px">${esc(i.desc||'Tidak ada deskripsi.')}</p><div class="row" style="margin-top:14px"><div class="av">${own?'K':esc(i.seller[0])}</div><div><b>${own?'Kamu':esc(i.seller)} <small>· ${esc(i.since||'NOV 2026')}</small></b><small style="color:var(--g);font-weight:600">${ic('check',11)} Mahasiswa terverifikasi</small></div></div></div><div class="act">${own?`<button class="btn out" data-a="del" data-id="${i.id}">Hapus listing</button>`:`<button class="btn" data-a="chat" data-id="${i.id}">${ic('chat',18)} Chat Pemilik</button>`}</div>`}
if(v==='post'){const f=S.form,ph=f.photos;return `<div class="bar"><button class="ib" data-a="go" data-v="home" aria-label="Tutup">${ic('x')}</button><b>Posting Barang</b></div><main><form class="f" id="pf"><div><b style="font-size:12px">Foto barang (${ph.length}/3)</b><div class="ph" style="margin-top:6px">${ph.map((p,n)=>`<div class="slot"><img src="${p}" alt="Foto ${n+1}"><button type="button" data-a="rmp" data-v="${n}" aria-label="Hapus foto ${n+1}" style="position:absolute;top:2px;right:2px;background:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center">${ic('x',12)}</button></div>`).join('')}${ph.length<3?`<label class="slot" style="font-weight:600;cursor:pointer">${ic('plus',20)}Foto<input id="pi" type="file" accept="image/*" multiple hidden></label>`:''}</div></div><label>Nama barang<input name="name" required maxlength="40" placeholder="Contoh: Buku Statistika Bisnis" value="${esc(f.name||'')}"></label><div class="two"><label>Kategori<select name="cat">${CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Kondisi<select name="cond">${CONDS.map(c=>`<option ${f.cond===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div><b style="font-size:12px">Pilih metode</b><div class="seg" style="margin-top:6px">${[['sell','Sell'],['swap','Swap'],['donate','Donate']].map(x=>`<button type="button" data-a="fm" data-v="${x[0]}" aria-pressed="${f.m===x[0]}">${x[1]}</button>`).join('')}</div></div>${f.m==='sell'?`<label>Harga (Rp)<input name="price" type="number" min="1000" step="1000" inputmode="numeric" required placeholder="30000" value="${esc(f.price||'')}"></label>`:''}${f.m==='swap'?`<label>Ingin ditukar dengan<input name="swap" required maxlength="40" placeholder="Contoh: Buku Statistika" value="${esc(f.swap||'')}"></label>`:''}<label>Titik COD<select name="cod">${COD.map(c=>`<option ${f.cod===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Deskripsi<textarea name="desc" rows="3" maxlength="200" placeholder="Kondisi, lama pemakaian, alasan dilepas">${esc(f.desc||'')}</textarea></label><small>${ic('pin',12)} Lokasi: ${esc(camp())}</small><button class="btn" type="submit">Posting</button></form></main>`}
if(v==='chat'){const c=cc();if(!c)return '';const i=item(c.itemId);return `<div class="chat"><header class="ch"><button class="ib" data-a="go" data-v="chats" aria-label="Kembali">${ic('back')}</button><div class="av">${esc(i.seller[0])}</div><div><b>${esc(i.seller)}</b><small>${esc(i.name)} · ${i.m==='sell'?rp(i.price):i.m==='swap'?'Tukar':'Gratis'}</small></div></header><div class="msgs" id="msgs"><p class="note">Transaksi aman: bertemu di ${esc(i.cod||'Gerbang Lama Unpad')}</p>${c.msgs.map(m=>`<div class="m ${m.f==='me'?'me':''}">${esc(m.t)}</div>`).join('')}</div><div class="qr">${['Masih ada, kak?','Bisa COD di kampus?','Boleh nego?'].map(x=>`<button class="chip" data-a="quick" data-v="${x}">${x}</button>`).join('')}</div><form class="inp" id="cf"><input id="mi" placeholder="Tulis pesan..." aria-label="Tulis pesan" autocomplete="off"><button type="submit" aria-label="Kirim">${ic('send',18)}</button></form></div>`}
if(v==='chats')return `<header class="hd"><b style="font-size:18px">Chat</b></header><main>${S.chats.map(c=>{const i=item(c.itemId);if(!i)return '';const l=c.msgs[c.msgs.length-1];return `<button class="row" data-a="oc" data-id="${c.id}"><div class="av">${esc(i.seller[0])}</div><div><b>${esc(i.seller)} · ${esc(i.name)}</b><small>${esc(l?l.t:'')}</small></div></button>`}).join('')||'<p class="empty">Belum ada chat. Buka barang lalu ketuk Chat Pemilik.</p>'}</main>${nav('chats')}`;
if(v==='profile'){const mine=S.items.filter(i=>i.own);return `<header class="hd"><div class="l" style="gap:14px"><div class="av" style="width:54px;height:54px;font-size:20px">M</div><div><b style="font-size:16px">Mahasiswa</b><div style="font-size:12px;opacity:.85">${esc(S.user.email)}</div><span class="pill" style="display:inline-flex;gap:4px;align-items:center;font-size:11px;margin-top:6px">${ic('check',11)} Mahasiswa terverifikasi · ${esc(camp())}</span></div></div></header><main><h2 class="s">Listing saya<small>${mine.length}</small></h2>${mine.map(i=>`<button class="row" data-a="open" data-id="${i.id}"><div class="th" style="background:${col(i)};position:relative;overflow:hidden">${i.photos&&i.photos[0]?`<img src="${i.photos[0]}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:ic(CI[i.cat],24)}</div><div><b>${esc(i.name)}</b><span class="l">${bd(i.m)}<span class="pr">${i.m==='sell'?rp(i.price):i.m==='swap'?'Tukar':'Gratis'}</span></span></div></button>`).join('')||'<p class="hint" style="margin-bottom:10px">Belum ada listing. Ketuk + untuk posting barang.</p>'}<button class="btn out" data-a="out" style="margin-top:12px">Keluar</button></main>${nav('profile')}`}
return '';
}
function render(){$('#app').innerHTML=V();const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
function go(v,cur){S.view=v;if(cur!==undefined)S.cur=cur;S.err='';if(v==='post')S.form={m:'sell',photos:[]};render();scrollTo(0,0)}
function cap(){const f=$('#pf');if(!f)return;const d=new FormData(f);['name','cat','cond','price','swap','cod','desc'].forEach(k=>{if(d.has(k))S.form[k]=d.get(k)})}
const newCode=()=>String(Math.floor(100000+Math.random()*900000));
function send(t){const c=cc();if(!c||!t.trim())return;c.msgs.push({f:'me',t:t.trim()});sv();render();const id=c.id;setTimeout(()=>{const x=S.chats.find(y=>y.id===id);if(!x)return;x.msgs.push({f:'them',t:/cod|ketemu|kampus/i.test(t)?'Bisa, ketemu di titik COD yang tertera ya.':/nego|kurang|turun/i.test(t)?'Boleh, harga bisa dibicarakan saat ketemu.':'Masih ada kok. Silakan atur waktu ketemunya ya.'});sv();if(S.view==='chat'&&S.cur===id)render()},900)}
document.addEventListener('click',e=>{const a=e.target.closest('#app [data-a]');if(!a)return;const v=a.dataset.v,id=+a.dataset.id;
switch(a.dataset.a){
case'skip':S.seen=true;sv();return go('login');
case'next':if(S.ob<2){S.ob++;return render()}S.seen=true;sv();return go('login');
case'go':if(S.view==='post')cap();return go(v);
case'hm':S.m=v;return render();
case'open':S.from=S.view;return go('detail',id);
case'del':S.items=S.items.filter(x=>x.id!==id);sv();toast('Listing dihapus');return go('profile');
case'chat':{let c=S.chats.find(x=>x.itemId===id);if(!c){const i=item(id);c={id:Date.now(),itemId:id,msgs:[{f:'them',t:`Halo! ${i.name} masih tersedia. Ada yang mau ditanyakan?`}]};S.chats.push(c);sv()}return go('chat',c.id)}
case'oc':return go('chat',id);
case'quick':return send(v);
case'fm':cap();S.form.m=v;return render();
case'rmp':cap();S.form.photos.splice(+v,1);return render();
case'campus':S.auth.campus=v;S.err='';return render();
case'resend':S.auth.code=newCode();toast('Kode baru dibuat');return render();
case'chgem':S.auth.step='email';S.err='';return render();
case'out':S.user=null;S.auth={step:'email',email:'',code:'',campus:''};sv();return go('login');
}});
document.addEventListener('change',e=>{if(e.target.id!=='pi')return;cap();const fs=[...e.target.files].slice(0,3-S.form.photos.length);let n=fs.length;if(!n)return;fs.forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.form.photos.push(c.toDataURL('image/jpeg',.72));if(--n===0)render()};im.src=r.result};r.readAsDataURL(f)})});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,a=S.auth;
if(f.id==='lf'){S.err='';
 if(a.step==='email'){const em=$('#em').value.trim();if(!/^[^@\s]+@[^@\s]+\.ac\.id$/i.test(em)){S.err='Gunakan email kampus yang berakhiran .ac.id';return render()}a.email=em;a.code=newCode();a.step='otp';return render()}
 if(a.step==='otp'){if($('#otp').value.trim()!==a.code){S.err='Kode OTP salah. Cek lagi atau kirim ulang kode.';return render()}a.step='campus';return render()}
 if(!a.campus){S.err='Pilih salah satu kampus dulu.';return render()}
 S.user={email:a.email,campus:a.campus,verified:true};sv();return go('home')}
if(f.id==='cf')return send($('#mi').value);
if(f.id==='pf'){cap();const d=S.form;if(!d.photos.length){return toast('Tambahkan minimal 1 foto')}
 S.items.unshift({id:Date.now(),name:d.name.trim(),m:d.m,price:+d.price||0,swap:(d.swap||'').trim(),cat:d.cat||CATS[0],cond:d.cond||CONDS[0],cod:d.cod||COD[0],km:0.1,seller:'Kamu',since:'NOV 2026',desc:(d.desc||'').trim(),own:true,photos:d.photos});
 try{sv()}catch(x){}toast('Barang diposting');go('home')}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();

</script>
</body>
</html>
